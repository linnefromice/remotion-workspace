<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFlow — キャプチャ一覧</title>
<style>
:root{color-scheme:dark;--bg:#101619;--panel:#1b252a;--line:#3b4c55;--text:#eef2f3;--muted:#b3c0c6;--accent:#9ddad4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}main{max-width:1800px;margin:auto;padding:32px}header{border-bottom:1px solid var(--line);padding-bottom:24px}h1{font-size:32px;margin:0}header p{margin:8px 0;color:var(--muted)}code{color:var(--accent)}.tools{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin:24px 0}label{display:grid;gap:6px}input,select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}input{width:300px;max-width:100%}button{cursor:pointer}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}#count{color:var(--muted);margin-left:auto}section{margin:32px 0}h2{font-size:21px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}article{border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}.capture{display:block;padding:0;border:0;border-radius:0;width:100%;background:#111;cursor:zoom-in}.capture img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain}.info{padding:16px}.info h3{font-size:16px;overflow-wrap:anywhere;margin:0 0 6px}.meta{color:var(--muted);font-size:13px}.links{display:flex;gap:20px;margin-top:10px}#empty{padding:48px 0;color:var(--muted)}[hidden]{display:none!important}dialog{width:96vw;max-width:1960px;max-height:96vh;padding:20px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px}dialog::backdrop{background:#000c}.dialog-head{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}#detail-title{margin:0;font-size:18px;overflow-wrap:anywhere}#detail-image{display:block;width:100%;height:auto}dialog p{color:var(--muted);margin-bottom:0}@media(min-width:1500px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){main{padding:20px}.grid{grid-template-columns:1fr}.tools{align-items:stretch;flex-direction:column}input{width:100%}#count{margin-left:0}.dialog-head{align-items:start}h1{font-size:27px}}
</style>
</head>
<body>
<main>
<header><h1>AgentFlow <span style="font-weight:400;color:var(--muted)">/ キャプチャ一覧</span></h1>
<p id="summary"></p><p>画像をクリックすると拡大。再撮影は <code>pnpm gallery:agent-flow</code></p></header>
<div class="tools">
<label>名前で検索<input type="search" id="search" placeholder="例: IconsV2 / DecisionStory"></label>
<label>題材<select id="group"><option value="">すべての題材</option></select></label>
<button id="reset" type="button">絞り込みを解除</button><span id="count" role="status" aria-live="polite"></span>
</div>
<div id="gallery"></div><p id="empty" hidden>該当するキャプチャがありません。検索条件を変更してください。</p>
</main>
<dialog aria-labelledby="detail-title" id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button type="button" id="close">閉じる（Esc）</button></div><img id="detail-image" alt=""><p><a id="original" target="_blank" rel="noopener">原寸PNGを開く</a> · <span id="detail-meta"></span></p></dialog>
<script id="gallery-data" type="application/json">__GALLERY_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#gallery-data').textContent);
const gallery=document.querySelector('#gallery'),search=document.querySelector('#search'),group=document.querySelector('#group'),dialog=document.querySelector('#detail');
const groups=[...new Set(data.items.map(item=>item.group))];
document.querySelector('#summary').textContent=`${data.items.length} compositions · ${data.mode} · 撮影: ${new Date(data.generatedAt).toLocaleString('ja-JP')}`;
const metadata=item=>`frame ${item.frame} / ${(item.frame/item.fps).toFixed(2)}秒 · ${item.width} × ${item.height} · ${item.fps}fps`;
let opener;
function showDetail(item,button){opener=button;document.querySelector('#detail-title').textContent=item.id;const img=document.querySelector('#detail-image');img.src=item.image;img.alt=`${item.id}のフレーム${item.frame}`;document.querySelector('#original').href=item.image;document.querySelector('#detail-meta').textContent=metadata(item);dialog.showModal();document.querySelector('#close').focus()}
document.querySelector('#close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('close',()=>opener?.focus());
for(const name of groups){const option=document.createElement('option');option.value=name;option.textContent=name;group.append(option);const section=document.createElement('section');section.dataset.group=name;const title=document.createElement('h2');title.textContent=name;section.append(title);const grid=document.createElement('div');grid.className='grid';section.append(grid);gallery.append(section);
for(const item of data.items.filter(item=>item.group===name)){const article=document.createElement('article');article.dataset.name=item.id.toLowerCase();const button=document.createElement('button');button.className='capture';button.type='button';button.setAttribute('aria-label',`${item.id}を拡大`);const img=document.createElement('img');img.src=item.image;img.alt=`${item.id}のフレーム${item.frame}`;img.width=item.width;img.height=item.height;img.loading='lazy';button.append(img);button.addEventListener('click',()=>showDetail(item,button));const info=document.createElement('div');info.className='info';const heading=document.createElement('h3');heading.textContent=item.id;const meta=document.createElement('div');meta.className='meta';meta.textContent=metadata(item);const links=document.createElement('div');links.className='links';const original=document.createElement('a');original.href=item.image;original.target='_blank';original.rel='noopener';original.textContent='原寸PNG';links.append(original);info.append(heading,meta,links);article.append(button,info);grid.append(article)}}
function filter(){let count=0;for(const section of gallery.children){let visible=0;for(const article of section.querySelectorAll('article')){const show=(!group.value||section.dataset.group===group.value)&&article.dataset.name.includes(search.value.trim().toLowerCase());article.hidden=!show;if(show)visible++}section.hidden=visible===0;count+=visible}document.querySelector('#count').textContent=`${count} / ${data.items.length} 件`;document.querySelector('#empty').hidden=count!==0}
search.addEventListener('input',filter);group.addEventListener('change',filter);document.querySelector('#reset').addEventListener('click',()=>{search.value='';group.value='';filter();search.focus()});filter();
</script>
</body>
</html>
